<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#050608">
  <title>ROOMSCAN — Capture</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050608; }
    video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #111; }
    .shade { position: fixed; inset: 0; background: linear-gradient(#05060888, transparent 28%, transparent 62%, #050608d9); pointer-events: none; }
    header { position: fixed; z-index: 2; top: max(18px, env(safe-area-inset-top)); left: 20px; right: 20px; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 13px; font-weight: 900; letter-spacing: .2em; }
    .session { padding: 7px 10px; border: 1px solid #ffffff30; border-radius: 99px; background: #0007; font-size: 11px; }
    main { position: fixed; z-index: 2; inset: 0; display: grid; place-items: center; pointer-events: none; }
    .capture { position: relative; width: 190px; height: 190px; display: grid; place-items: center; pointer-events: auto; }
    svg { position: absolute; inset: 0; transform: rotate(-90deg); filter: drop-shadow(0 4px 20px #000); }
    circle { fill: #050608a8; stroke-width: 7; }
    .track { stroke: #ffffff2b; }
    .progress { stroke: #74f2ba; stroke-linecap: round; stroke-dasharray: 527.8; stroke-dashoffset: 527.8; transition: stroke-dashoffset .08s linear; }
    #start { position: relative; width: 132px; height: 132px; border: 0; border-radius: 50%; color: #06100c; background: #74f2ba; font-weight: 950; font-size: 21px; letter-spacing: .06em; box-shadow: inset 0 0 0 5px #ffffff3d, 0 10px 35px #0009; }
    #start:disabled { color: #dce4e0; background: #1d2624; }
    #count { position: relative; font-size: 56px; font-weight: 900; font-variant-numeric: tabular-nums; text-shadow: 0 3px 20px #000; }
    .guidance { position: fixed; z-index: 2; left: 20px; right: 20px; bottom: max(28px, env(safe-area-inset-bottom)); text-align: center; color: #e9edf2; font-size: 14px; text-shadow: 0 2px 10px #000; }
    .guidance strong { display: block; margin-bottom: 5px; font-size: 18px; }
    #motion { position: fixed; z-index: 4; top: 28%; left: 16px; right: 16px; padding: 18px; border: 2px solid #ff6262; border-radius: 16px; background: #a90f18e8; text-align: center; font-size: 20px; font-weight: 900; transform: translateY(-15px); opacity: 0; transition: .2s; pointer-events: none; }
    #motion.show { transform: none; opacity: 1; }
    #toast { position: fixed; z-index: 5; inset: 0; display: grid; place-items: center; padding: 30px; background: #050608eb; text-align: center; font-size: 18px; line-height: 1.5; }
    #toast[hidden] { display: none; }
    #toast-action { margin-top: 28px; padding: 14px 20px; border: 0; border-radius: 99px; background: #74f2ba; color: #06100c; font: inherit; font-weight: 900; }
  </style>
</head>
<body>
  <video id="preview" playsinline muted></video>
  <div class="shade"></div>
  <header><div class="brand">ROOMSCAN</div><div class="session" id="session"></div></header>
  <main>
    <div class="capture">
      <svg viewBox="0 0 190 190" aria-hidden="true"><circle class="track" cx="95" cy="95" r="84"></circle><circle class="progress" id="ring" cx="95" cy="95" r="84"></circle></svg>
      <button id="start" type="button">START</button>
      <div id="count" hidden>15</div>
    </div>
  </main>
  <div class="guidance"><strong id="headline">Walk a short arc around the room</strong><span id="detail">Move sideways while aiming at walls and furniture.</span></div>
  <div id="motion">WALK SIDEWAYS<br><small>Rotating in place cannot create depth.</small></div>
  <div id="toast" hidden><div><div id="toast-message"></div><button id="toast-action" type="button">SCAN ANOTHER AREA</button></div></div>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
